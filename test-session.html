<!DOCTYPE html>
<html>
<head>
    <title>세션 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        .result {
            background: #2a2a2a;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        pre {
            background: #0a0a0a;
            padding: 10px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <h1>세션 및 사용자 정보 테스트</h1>
    
    <button onclick="checkSession()">세션 확인</button>
    <button onclick="getUserInfo()">사용자 정보 가져오기</button>
    <button onclick="testLogin()">테스트 로그인 (admin/admin)</button>
    
    <div class="result" id="result">
        결과가 여기에 표시됩니다.
    </div>

    <script>
        function checkSession() {
            fetch('/check-session.php', {
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerHTML = 
                    '<h3>세션 확인 결과:</h3><pre>' + 
                    JSON.stringify(data, null, 2) + 
                    '</pre>';
            })
            .catch(error => {
                document.getElementById('result').innerHTML = 
                    '<h3>에러:</h3><pre>' + error + '</pre>';
            });
        }

        function getUserInfo() {
            fetch('/get-user-info.php', {
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerHTML = 
                    '<h3>사용자 정보:</h3><pre>' + 
                    JSON.stringify(data, null, 2) + 
                    '</pre>';
            })
            .catch(error => {
                document.getElementById('result').innerHTML = 
                    '<h3>에러:</h3><pre>' + error + '</pre>';
            });
        }

        function testLogin() {
            const username = prompt('아이디를 입력하세요:', 'admin');
            const password = prompt('비밀번호를 입력하세요:', '');
            
            if (!username || !password) {
                alert('아이디와 비밀번호를 입력해주세요.');
                return;
            }

            fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({ username, password })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerHTML = 
                    '<h3>로그인 결과:</h3><pre>' + 
                    JSON.stringify(data, null, 2) + 
                    '</pre>';
                if (data.success) {
                    alert('로그인 성공!');
                }
            })
            .catch(error => {
                document.getElementById('result').innerHTML = 
                    '<h3>에러:</h3><pre>' + error + '</pre>';
            });
        }

        // 페이지 로드시 자동 세션 확인
        window.onload = function() {
            checkSession();
        };
    </script>
</body>
</html>
